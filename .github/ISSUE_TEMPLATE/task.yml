name: WBS 작업
description: WBS 말단 작업 하나를 등록합니다 (이슈 1개 = 작업 1개 = 담당 1명)
title: "[WBS번호] 작업명"
body:
  - type: input
    id: wbs
    attributes:
      label: WBS 번호
      placeholder: "2.3.1"
    validations:
      required: true
  - type: input
    id: req
    attributes:
      label: 관련 RQ-ID 또는 공통 작업
      placeholder: "RP-05 / 외부 입금 반영"
  - type: textarea
    id: goal
    attributes:
      label: 할 일
      description: 동사로 끝나게 적어 주세요
      placeholder: "채권자가 가상 입금을 선택해 지정한 회차에 반영한다"
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      description: 무엇을 보면 끝났다고 할 수 있는지 적어 주세요
      placeholder: "- 선택한 회차의 상환 내역·잔액 확인\n- 같은 입금을 다시 선택해도 추가 차감 없음\n- 정정 후 최초 기록과 정정 내역 함께 조회"
    validations:
      required: true
  - type: input
    id: due
    attributes:
      label: 마감일
      placeholder: "YYYY-MM-DD"
