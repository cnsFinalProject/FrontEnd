name: 기획·설계 결정
description: 기획이나 기술 선택이 바뀌거나 정해야 할 때 등록합니다
title: "[결정] 요약"
labels: ["decision"]
body:
  - type: textarea
    id: question
    attributes:
      label: 정할 것
      placeholder: "관리자 연체 카드를 기준 시각의 계약 수로 볼지, 기간 내 신규 연체 회차 수도 함께 표시할지"
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: 선택지와 쟁점
  - type: input
    id: owner
    attributes:
      label: 결정자 (팀 / 멘토)
  - type: textarea
    id: result
    attributes:
      label: 결정 결과
      description: 결정일·적용 범위·근거를 남기고 관련 요구사항, FE 가이드와 BE 계약에 반영합니다
